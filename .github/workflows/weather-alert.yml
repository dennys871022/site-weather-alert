name: 工地天氣警示

on:
  # 私人 repo 版：每 30 分鐘一次，每月約 1,440 分鐘，加上代辦提醒仍在 2,000 分鐘免費額度內
  # 不需要再設 cron-job.org
  workflow_dispatch:
    inputs:
      force:
        description: "強制推送目前狀態（測試用，填 1）"
        required: false
        default: ""
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: weather-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # 推播狀態存在 Actions cache，不 commit 回 repo（避免每 10 分鐘觸發 Streamlit 重新部署）
      - name: 還原推播狀態
        uses: actions/cache/restore@v4
        with:
          path: weather_alert/state.json
          key: weather-state-${{ github.run_id }}
          restore-keys: weather-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 檢查示警並推播
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_WEATHER }}
          DISCORD_MENTION: ${{ vars.WEATHER_MENTION }}
          SITE_COUNTIES: ${{ vars.SITE_COUNTIES || '臺北市,新北市' }}
          RAIN_KEYWORDS: ${{ vars.RAIN_KEYWORDS }}
          FORCE: ${{ github.event.inputs.force }}
        run: python weather_alert/ncdr_alert.py

      - name: 儲存推播狀態
        if: always()
        uses: actions/cache/save@v4
        with:
          path: weather_alert/state.json
          key: weather-state-${{ github.run_id }}
